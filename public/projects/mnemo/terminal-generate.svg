<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" font-family="'JetBrains Mono', 'Courier New', monospace">
  <rect width="900" height="435" fill="#1c1b18"/>
  <rect x="0" y="0" width="900" height="36" fill="#2a2823"/>
  <circle cx="22" cy="18" r="5.5" fill="#e0605a"/>
  <circle cx="42" cy="18" r="5.5" fill="#e0b95a"/>
  <circle cx="62" cy="18" r="5.5" fill="#7fbf7f"/>
  <text x="450" y="23" text-anchor="middle" font-size="12" fill="#a89f8c">mnemo — generate</text>

  <g font-size="15" fill="#e8e2d4">
    <text x="26" y="70"><tspan fill="#7fbf7f">$</tspan> mnemo-generate notes/session.cornell.md --output cards/session.csv</text>
    <text x="26" y="100" fill="#a89f8c">planning objectives... 18 knowledge units</text>
    <text x="26" y="126" fill="#a89f8c">generating facts (cloze, basic, overlapping, typed)</text>
