    <text x="26" y="246" fill="#e0b95a">review gate: open cards/session.csv to approve</text>
    <text x="26" y="286" fill="#a89f8c">next: mnemo-audit cards/session.csv --settings cards/session.settings.json</text>
  </g>

  <rect x="24" y="312" width="9" height="18" fill="#e8e2d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
