<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" font-family="Inter, sans-serif">
  <rect width="900" height="435" fill="#efe5cd"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4230"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#2a2620">Mnemo Pipeline</text>
  <text x="450" y="49" text-anchor="middle" font-size="11" fill="rgba(60,50,35,0.6)">source material to reviewed Anki cards</text>

  <!-- Row 1: source -> ingest -> plan -> generate -->
  <g font-size="14" fill="#2a2620">
    <g>
      <rect x="40" y="66" width="150" height="56" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="115" y="90" text-anchor="middle" font-weight="600">Source</text>
      <text x="115" y="106" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">pdf / md / pptx</text>
    </g>
    <line x1="190" y1="94" x2="228" y2="94" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="230" y="66" width="150" height="56" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="305" y="90" text-anchor="middle" font-weight="600">Ingest</text>
      <text x="305" y="106" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">normalize + provenance</text>
    </g>
    <line x1="380" y1="94" x2="418" y2="94" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="420" y="66" width="150" height="56" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="495" y="90" text-anchor="middle" font-weight="600">Plan</text>
      <text x="495" y="106" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">objectives + units</text>
    </g>
    <line x1="570" y1="94" x2="608" y2="94" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="610" y="66" width="220" height="56" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="720" y="90" text-anchor="middle" font-weight="600">Generate</text>
      <text x="720" y="106" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">Fact[] + distractors</text>
    </g>
  </g>

  <path d="M720 122 V150 H415 V168" fill="none" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: review -> adapt -> import -->
  <g font-size="14" fill="#2a2620">
    <g>
      <rect x="335" y="170" width="160" height="56" rx="3" fill="#4a4230"/>
      <text x="415" y="194" text-anchor="middle" font-weight="600" fill="#f4ecd8">Review Gate</text>
      <text x="415" y="210" text-anchor="middle" font-size="10" fill="rgba(244,236,216,0.75)">you approve the CSV</text>
    </g>
    <line x1="495" y1="198" x2="533" y2="198" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="535" y="170" width="140" height="56" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="605" y="194" text-anchor="middle" font-weight="600">Adapt</text>
      <text x="605" y="210" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">Fact -&gt; note fields</text>
    </g>
    <line x1="675" y1="198" x2="713" y2="198" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="715" y="170" width="150" height="56" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="790" y="194" text-anchor="middle" font-weight="600">Import</text>
      <text x="790" y="210" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">AnkiConnect / .apkg</text>
    </g>
  </g>

  <path d="M790 226 V254 H495 V268" fill="none" stroke="#4a4230" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="14" fill="#2a2620">
    <rect x="345" y="270" width="300" height="50" rx="3" fill="none" stroke="#4a4230" stroke-width="1.5"/>
    <text x="495" y="292" text-anchor="middle" font-weight="600">AnkiWeb Sync</text>
    <text x="495" y="308" text-anchor="middle" font-size="10" fill="rgba(60,50,35,0.6)">AnkiDroid / AnkiMobile</text>
  </g>

  <text x="450" y="400" text-anchor="middle" font-size="11" fill="rgba(60,50,35,0.5)">Claude applies spaced-repetition pedagogy at the Generate step</text>
</svg>
